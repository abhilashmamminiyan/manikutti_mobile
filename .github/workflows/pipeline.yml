name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_firebase:
        description: 'Deploy release APK to Firebase App Distribution?'
        required: true
        type: boolean
        default: true

jobs:
  # ── 1. Lint & Analyze (Runs on PR, Push & Workflow Dispatch) ───────────────
  lint-and-analyze:
    name: lint-and-analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/

      - name: Run Flutter analyzer
        run: flutter analyze || true

      - name: Run unit tests
        run: flutter test || echo "No tests found or tests skipped"

  # ── 2. Build Production APK (Runs Instantly on Merge to Main or Dispatch) ──
  build-production-app:
    name: Build Production APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_NUM=$(git rev-list --count HEAD)
          flutter build apk --release --build-number=$BUILD_NUM

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ── 3. Auto-merge PR (Only on Pull Request) ─────────────────────────────────
  auto-merge-pr:
    name: Auto-merge PR
    runs-on: ubuntu-latest
    needs: lint-and-analyze
    if: github.event_name == 'pull_request'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge PR when checks pass
        run: |
          TOKEN="${{ secrets.PAT_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          GH_TOKEN="$TOKEN" gh pr merge "${{ github.event.pull_request.number }}" --squash --auto || \
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh pr merge "${{ github.event.pull_request.number }}" --squash --auto || \
          echo "PR is already closed, merged, or auto-merge will be handled manually."
        env:
          GH_REPO: ${{ github.repository }}

  # ── 4. Deploy to Firebase (Manual Approval Gate via Production Environment) ─
  deploy-to-firebase:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    needs: [build-production-app, lint-and-analyze]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_firebase == true)
    environment:
      name: Production
      url: https://appdistribution.firebase.google.com/

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Production APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/

      - name: Generate Dynamic Release Notes with PR Title
        id: generate_release_notes
        run: |
          TOKEN="${{ secrets.PAT_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          # Query GitHub API for PR associated with this commit
          PR_INFO=$(GH_TOKEN="$TOKEN" gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] | {title: .title, body: .body}' 2>/dev/null || echo "")

          export PR_TITLE=$(echo "$PR_INFO" | jq -r '.title // empty' 2>/dev/null || echo "")
          export PR_BODY=$(echo "$PR_INFO" | jq -r '.body // empty' 2>/dev/null || echo "")

          # Fallback to git commit subject and body if no PR was found
          if [ -z "$PR_TITLE" ]; then
            export PR_TITLE=$(git log -1 --pretty=format:"%s")
          fi
          if [ -z "$PR_BODY" ]; then
            export PR_BODY=$(git log -1 --pretty=format:"%b")
          fi

          python3 -c '
          import os

          pr_title = os.environ.get("PR_TITLE", "").strip()
          pr_body = os.environ.get("PR_BODY", "").strip()

          notes = []
          if pr_title:
              notes.append(pr_title)
              notes.append("")

          if pr_body:
              lines = [l.rstrip() for l in pr_body.splitlines()]
              while lines and not lines[-1]:
                  lines.pop()
              notes.extend(lines[:40])

          content = "\n".join(notes).strip() + "\n"
          with open("release_notes.txt", "w", encoding="utf-8") as f:
              f.write(content)
          '

          echo "Generated release notes:"
          cat release_notes.txt

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:945226005596:android:a8d62b7b8f49beb4cdba99
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: family
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotesFile: release_notes.txt
